name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # pushes to main run this same job through deploy.yml
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ensure media validation tools (ffmpeg/ffprobe)
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:browser
      # The browser tests above run at the origin root; Pages serves a subpath, so build that way too.
      - name: Subpath build guard
        env:
          ASTRO_BASE: /${{ github.event.repository.name }}
          ASTRO_SITE: https://${{ github.repository_owner }}.github.io
        run: |
          npm run build:preview
          npm run check:base -- "$ASTRO_BASE"
