<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" role="img" aria-labelledby="scene-arr-title scene-arr-desc">
  <title id="scene-arr-title">The Green Lantern Saloon on Wabasha Street</title>
  <desc id="scene-arr-desc">Illustrated reconstruction: Graphic noir scene of a dark rainy Wabasha Street with an isolated glowing green and amber saloon doorway, wet asphalt reflections, and shadowy figures in fedoras.</desc>
  <defs>
    <linearGradient id="door-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4EBA74" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F3EFE6" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#C62F42" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wet-street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="40%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <radialGradient id="lamp-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F3EFE6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#F3EFE6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Street Background -->
  <rect width="1000" height="420" fill="#0E121A"/>

  <!-- Brick Building Facades (Graphic Noir Silhouettes) -->
  <polygon points="0,420 0,60 380,120 380,420" fill="#080A0E"/>
  <polygon points="380,420 380,120 680,150 680,420" fill="#121722"/>
  <polygon points="680,420 680,150 1000,80 1000,420" fill="#090B0F"/>

  <!-- Architectural Molding & Upper Windows (Dark/Blind) -->
  <rect x="60" y="160" width="45" height="70" fill="#040507" stroke="#1A2130" stroke-width="2"/>
  <rect x="140" y="180" width="45" height="70" fill="#040507" stroke="#1A2130" stroke-width="2"/>
  <rect x="220" y="200" width="45" height="70" fill="#040507" stroke="#1A2130" stroke-width="2"/>
  
  <rect x="740" y="180" width="50" height="80" fill="#040507" stroke="#18202E" stroke-width="2"/>
  <rect x="840" y="160" width="50" height="80" fill="#040507" stroke="#18202E" stroke-width="2"/>

  <!-- Street Lamp Glow on Corner -->
  <circle cx="280" cy="240" r="120" fill="url(#lamp-halo)"/>
  <line x1="280" y1="200" x2="280" y2="420" stroke="#040507" stroke-width="6"/>

  <!-- The Saloon Entrance (Focal Point) -->
  <!-- Glowing Doorway Frame -->
  <rect x="460" y="220" width="130" height="200" fill="#050608" stroke="#1F2838" stroke-width="4"/>
  <rect x="470" y="235" width="110" height="185" fill="#1A231C"/>
  <rect x="475" y="240" width="100" height="180" fill="url(#door-glow)"/>

  <!-- Green Lantern Saloon Sign -->
  <polygon points="430,185 620,185 605,215 445,215" fill="#07080B" stroke="#283446" stroke-width="2"/>
  <text x="525" y="206" fill="#F3EFE6" font-family="'Barlow Condensed', sans-serif" font-weight="600" font-size="18" letter-spacing="4" text-anchor="middle">GREEN LANTERN</text>
  <!-- Stylized Green Lantern Symbol -->
  <circle cx="525" cy="165" r="12" fill="#38A169" stroke="#F3EFE6" stroke-width="2"/>
  <line x1="525" y1="145" x2="525" y2="153" stroke="#F3EFE6" stroke-width="2"/>

  <!-- Saloon Door Glazing & Silhouette Inside -->
  <rect x="490" y="260" width="70" height="90" fill="#F3EFE6" fill-opacity="0.85"/>
  <!-- Figure in Doorway (Dan Hogan or patron silhouette) -->
  <path d="M525,290 C515,290 512,278 525,278 C538,278 535,290 525,290 Z" fill="#0B0C10"/>
  <!-- Fedora Hat Rim -->
  <ellipse cx="525" cy="280" rx="14" ry="4" fill="#0B0C10"/>
  <!-- Trenchcoat Silhouette -->
  <polygon points="510,300 540,300 550,420 500,420" fill="#0B0C10"/>

  <!-- Wet Street & Pavement Surface -->
  <rect y="420" width="1000" height="230" fill="url(#wet-street)"/>

  <!-- Sidewalk Curb Line -->
  <line x1="0" y1="420" x2="1000" y2="420" stroke="#F3EFE6" stroke-opacity="0.25" stroke-width="3"/>
  <line x1="0" y1="425" x2="1000" y2="425" stroke="#050608" stroke-width="4"/>

  <!-- Light Spill Reflection on Wet Asphalt -->
  <polygon points="460,425 590,425 680,650 370,650" fill="url(#door-glow)" opacity="0.35"/>
  <ellipse cx="525" cy="460" rx="60" ry="10" fill="#4EBA74" fill-opacity="0.25"/>
  <ellipse cx="525" cy="520" rx="90" ry="12" fill="#F3EFE6" fill-opacity="0.15"/>
  <ellipse cx="530" cy="590" rx="120" ry="14" fill="#C62F42" fill-opacity="0.15"/>

  <!-- Shadowy Indistinct Figures Waiting in Darkness (Left Foreground) -->
  <g opacity="0.9">
    <!-- Figure 1 (Trenchcoat & Fedora in Profile) -->
    <ellipse cx="180" cy="380" rx="16" ry="6" fill="#050608"/>
    <path d="M180,380 C170,380 168,365 180,365 C192,365 190,380 180,380 Z" fill="#050608"/>
    <polygon points="160,390 200,390 215,560 145,560" fill="#07090D"/>
    <!-- Cigarette Ember (Tiny Crimson Highlight) -->
    <circle cx="190" cy="385" r="2.5" fill="#C62F42"/>
  </g>

  <!-- Shadowy Figure 2 (Right Alleyway) -->
  <g opacity="0.85">
    <ellipse cx="880" cy="395" rx="18" ry="6" fill="#050608"/>
    <path d="M880,395 C870,395 868,380 880,380 C892,380 890,395 880,395 Z" fill="#050608"/>
    <polygon points="860,405 900,405 920,580 840,580" fill="#06070B"/>
  </g>

  <!-- Reconstruction Label Badge (Spec R3 & R13 requirement) -->
  <rect x="25" y="25" width="230" height="28" fill="#0B0C10" fill-opacity="0.85" stroke="#F3EFE6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="35" y="44" fill="#B8B8BC" font-family="'Source Sans 3', sans-serif" font-size="12" letter-spacing="1">ILLUSTRATED RECONSTRUCTION</text>
  
  <rect width="1000" height="650" fill="none" stroke="#F3EFE6" stroke-opacity="0.15" stroke-width="2"/>
</svg>
