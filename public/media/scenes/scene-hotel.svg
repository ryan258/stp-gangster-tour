<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" role="img" aria-labelledby="scene-hotel-title scene-hotel-desc">
  <title id="scene-hotel-title">The Saint Paul Hotel Facade and Illuminated Suite</title>
  <desc id="scene-hotel-desc">Illustrated reconstruction: Imposing Italian Renaissance Revival brick and stone facade of The Saint Paul Hotel, with a single brightly illuminated corner suite window on the fourth floor and an interpretive interior room vignette.</desc>
  <defs>
    <linearGradient id="window-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#E2B158" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C62F42" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="vignette-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>
  </defs>

  <!-- Dark Atmospheric Night Sky -->
  <rect width="1000" height="650" fill="#090B0F"/>

  <!-- Left: The Great Hotel Facade (Columns, Cornice, Arches) -->
  <g transform="translate(0, 0)">
    <!-- Base Rusticated Stone Lower Floors -->
    <polygon points="40,650 40,80 620,40 620,650" fill="#10141D" stroke="#1A212E" stroke-width="2"/>
    <!-- Grand Cornice Band -->
    <polygon points="30,80 630,40 630,20 30,60" fill="#0A0C11" stroke="#222B3D" stroke-width="2"/>
    
    <!-- Repetitive Dark Hotel Windows (Grid) -->
    <!-- Floor 2 -->
    <rect x="90" y="480" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="180" y="470" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="270" y="460" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="360" y="450" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="450" y="440" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="540" y="430" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>

    <!-- Floor 3 -->
    <rect x="90" y="360" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="180" y="350" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="270" y="340" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="360" y="330" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="450" y="320" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="540" y="310" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>

    <!-- Floor 4: The Illuminated Suite (Focal Point) -->
    <rect x="90" y="240" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="180" y="230" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    
    <!-- The Single Lit Corner Window (Gleckman's Suite association) -->
    <g>
      <rect x="265" y="215" width="55" height="85" fill="url(#window-glow)" stroke="#F3EFE6" stroke-width="2"/>
      <line x1="292" y1="215" x2="292" y2="300" stroke="#0B0C10" stroke-width="2"/>
      <line x1="265" y1="255" x2="320" y2="255" stroke="#0B0C10" stroke-width="2"/>
      <!-- Shadow of telephone receiver and fedora on desk inside window -->
      <path d="M280,270 Q292,260 305,270 Z" fill="#0B0C10"/>
      <!-- Window light beam casting downward across hotel stone -->
      <polygon points="265,300 320,300 360,420 225,420" fill="#E2B158" fill-opacity="0.08"/>
    </g>

    <rect x="360" y="210" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="450" y="200" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>
    <rect x="540" y="190" width="45" height="75" fill="#040507" stroke="#1B2230" stroke-width="2"/>

    <!-- Hotel Canopy / Entrance Marquee at Street Level -->
    <polygon points="230,610 390,590 410,650 210,650" fill="#050608" stroke="#F3EFE6" stroke-opacity="0.2" stroke-width="2"/>
    <text x="310" y="635" fill="#F3EFE6" font-family="'Barlow Condensed', sans-serif" font-weight="600" font-size="16" letter-spacing="3" text-anchor="middle">SAINT PAUL HOTEL</text>
  </g>

  <!-- Right: Interpretive Interior Suite Vignette (Split Screen Composition) -->
  <g transform="translate(640, 50)">
    <!-- Vignette Framing Box -->
    <rect width="330" height="550" fill="url(#vignette-grad)" stroke="#222B3D" stroke-width="2" rx="4"/>
    <rect x="15" y="15" width="300" height="520" fill="#0B0E14" stroke="#171E2B" stroke-width="1"/>

    <!-- Vignette Header -->
    <rect x="15" y="15" width="300" height="35" fill="#101520"/>
    <text x="30" y="38" fill="#F3EFE6" font-family="'Barlow Condensed', sans-serif" font-weight="600" font-size="15" letter-spacing="2">SUITE INTERIOR — INTERPRETIVE</text>

    <!-- Interior Noir Scene: Executive Desk, Rotary Phone, Ledger, Whiskey Glass -->
    <!-- Heavy Drapes (Crimson Edge) -->
    <path d="M25,50 Q60,180 25,320 L15,320 L15,50 Z" fill="#C62F42" fill-opacity="0.8"/>
    <path d="M40,50 Q75,180 40,320 L25,320 L25,50 Z" fill="#1C2330" fill-opacity="0.6"/>

    <!-- Mahogany Desk Silhouette -->
    <polygon points="40,380 290,380 305,480 25,480" fill="#121620" stroke="#222C3D" stroke-width="2"/>
    
    <!-- Desk Lamp with Green Banker's Shade Glowing Warm Amber -->
    <path d="M90,320 Q120,290 150,320 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
    <polygon points="80,325 160,325 190,390 50,390" fill="#F3EFE6" fill-opacity="0.12"/>
    <line x1="120" y1="320" x2="120" y2="380" stroke="#C5A059" stroke-width="4"/>
    <ellipse cx="120" cy="380" rx="16" ry="6" fill="#C5A059"/>

    <!-- Rotary Telephone on Desk -->
    <ellipse cx="220" cy="370" rx="20" ry="10" fill="#040507" stroke="#333" stroke-width="1"/>
    <circle cx="220" cy="365" r="7" fill="#F3EFE6" fill-opacity="0.8"/>
    <path d="M200,350 Q220,335 240,350" stroke="#040507" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Financial Ledger & Paper Notes (The Money Trail) -->
    <polygon points="120,395 180,390 195,435 130,440" fill="#F3EFE6" stroke="#4A5263" stroke-width="1"/>
    <line x1="130" y1="405" x2="175" y2="400" stroke="#0B0C10" stroke-width="1.5"/>
    <line x1="132" y1="415" x2="178" y2="410" stroke="#0B0C10" stroke-width="1.5"/>
    <line x1="135" y1="425" x2="185" y2="420" stroke="#C62F42" stroke-width="2"/> <!-- Red mark on ledger -->

    <!-- Explanatory Caption inside Vignette -->
    <rect x="25" y="450" width="280" height="70" fill="#06080B" stroke="#1A212E" stroke-width="1"/>
    <text x="35" y="472" fill="#B8B8BC" font-family="'Source Sans 3', sans-serif" font-size="11">Leon Gleckman's headquarters suite.</text>
    <text x="35" y="490" fill="#B8B8BC" font-family="'Source Sans 3', sans-serif" font-size="11">Federal agents watched from across the street;</text>
    <text x="35" y="508" fill="#F3EFE6" font-family="'Source Sans 3', sans-serif" font-weight="600" font-size="11">Court records tracked the money, not the gossip.</text>
  </g>

  <!-- Reconstruction Label Badge -->
  <rect x="25" y="25" width="230" height="28" fill="#0B0C10" fill-opacity="0.85" stroke="#F3EFE6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="35" y="44" fill="#B8B8BC" font-family="'Source Sans 3', sans-serif" font-size="12" letter-spacing="1">ILLUSTRATED RECONSTRUCTION</text>
  
  <rect width="1000" height="650" fill="none" stroke="#F3EFE6" stroke-opacity="0.15" stroke-width="2"/>
</svg>
